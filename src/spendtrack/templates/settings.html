{% extends "base.html" %}
{% block content %}
<noscript>
  <div class="bg-warn-soft border border-line rounded-xl px-5 py-3 mb-6 text-sm text-fg">
    Для настроек нужен JavaScript (htmx): формы не отправятся. Включите его или правьте
    <code class="font-mono text-xs">config/taxonomy.toml</code> вручную.
  </div>
</noscript>
{% include "partials/settings_root.html" %}

<div class="bg-surface rounded-xl border border-line p-5">
  <h2 class="text-[15px] font-semibold text-fg mb-3">Тестер описания</h2>
  <form hx-post="/settings/test" hx-target="#tester-result" hx-swap="innerHTML" class="flex flex-wrap gap-2">
    <input name="description" placeholder="Например: ЛЕНТА 1234" aria-label="Описание для теста" required
           class="bg-surface-2 text-fg border border-line-strong rounded-lg px-3 py-2 flex-1 min-w-48 focus:outline-none focus:ring-2 focus:ring-accent">
    <button type="submit" class="bg-accent-bg hover:bg-accent-bg-hover text-white font-medium rounded-lg px-5 py-2 transition-colors">Проверить</button>
  </form>
  <div id="tester-result" class="mt-3 text-sm"></div>
</div>
{% endblock %}
