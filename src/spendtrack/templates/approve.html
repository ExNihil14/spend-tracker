{% extends "base.html" %}
{% block content %}
<div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
  <div class="px-5 py-3 flex items-center justify-between border-b border-slate-800">
    <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wide">На подтверждение</h2>
    <div class="flex items-center gap-3">
      <button hx-post="/api/reviews/approve-all"
              hx-target="#review-rows" hx-swap="outerHTML"
              hx-confirm="Одобрить все {{ pending | length }} записей?"
              class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-medium rounded-lg px-3 py-1.5 transition-colors">
        Одобрить все
      </button>
    </div>
  </div>
  <div class="overflow-x-auto">
  <table class="w-full text-sm">
    <thead>
      <tr class="text-left text-xs uppercase tracking-wide text-slate-500 border-b border-slate-800 bg-slate-950/40">
        <th class="px-5 py-2.5 font-medium">Дата</th>
        <th class="px-5 py-2.5 font-medium">Описание</th>
        <th class="px-5 py-2.5 font-medium text-right">Сумма</th>
        <th class="px-5 py-2.5 font-medium">Предложено</th>
        <th class="px-5 py-2.5 font-medium">Conf</th>
        <th class="px-5 py-2.5 font-medium"></th>
      </tr>
    </thead>
    {% include "partials/review_rows.html" %}
  </table>
  </div>
</div>
{% endblock %}
