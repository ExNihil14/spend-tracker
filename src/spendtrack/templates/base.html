<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spendtrack</title>
  <style>
    body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
    nav a { color: #93c5fd; text-decoration: none; margin-right: 14px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1e293b; font-size: 14px; }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; color: #0f172a; }
    .neg { color: #f87171; } .pos { color: #4ade80; }
    .summary { display: flex; gap: 20px; margin: 12px 0; flex-wrap: wrap; }
    input, select { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; }
    button { background: #3b82f6; color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  </style>
  <script src="/static/htmx.min.js"></script>
</head>
<body>
<div class="wrap">
  <nav>
    <strong>Spendtrack</strong>
    <a href="/">Расходы</a>
    <a href="/approve">Подтвердить ({{ pending | length }})</a>
  </nav>
  {% block content %}{% endblock %}
</div>
</body>
</html>
