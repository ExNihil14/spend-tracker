<!DOCTYPE html>
<html lang="ru" class="bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spendtrack</title>
  <script src="/static/tailwind.js"></script>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/chart.umd.min.js"></script>
  <meta name="htmx-config" content='{"historyCacheSize": 0}'>
  <style>
    /* Tailwind v4 preflight делает cursor:default у кнопок — возвращаем указатель */
    button:not(:disabled), [role="button"]:not(:disabled), summary, select:not(:disabled) { cursor: pointer; }
    /* Уход строки очереди: видимая преемственность при approve/skip */
    tr.review-row { transition: opacity 160ms ease, transform 160ms ease; }
    tr.review-row.htmx-swapping { opacity: 0; transform: translateX(-16px); }
    @media (prefers-reduced-motion: reduce) {
      tr.review-row, tr.review-row.htmx-swapping { transition: none; transform: none; }
    }
  </style>
</head>
<body hx-boost="true" class="bg-slate-950 text-slate-200 min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-6">
  <nav class="flex items-center gap-5 mb-8 pb-4 border-b border-slate-800">
    <strong class="text-lg text-white tracking-tight">Spendtrack</strong>
    <a href="/" class="font-semibold text-blue-400 hover:text-blue-300 transition-colors">Расходы</a>
    <a href="/dashboard" class="font-semibold text-blue-400 hover:text-blue-300 transition-colors">Дашборд</a>
    <a href="/approve" class="font-semibold text-blue-400 hover:text-blue-300 transition-colors">Подтвердить
      <span id="pending-count" class="ml-1 inline-flex items-center px-2 py-0.5 rounded-full text-xs bg-amber-500/20 text-amber-300">{{ pending | default([]) | length }}</span>
    </a>
  </nav>
  {% block content %}{% endblock %}
</div>
<div id="global-indicator" class="htmx-indicator fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70"
     style="pointer-events:none">
  <div class="bg-slate-900 rounded-xl px-6 py-5 border border-slate-700 flex items-center gap-4 shadow-2xl">
    <svg class="animate-spin h-6 w-6 text-blue-400" viewBox="0 0 24 24" fill="none">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
    <span class="text-slate-200 font-medium">Добавление…</span>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"
     class="fixed bottom-4 right-4 z-50 opacity-0 pointer-events-none transition-opacity duration-200
            bg-slate-800 border border-slate-600 text-slate-100 text-sm rounded-lg px-4 py-2 shadow-xl"></div>
<script>
  document.body.addEventListener('htmx:oobAfterSwap', function (e) {
    var t = document.getElementById('toast');
    if (!t || t.dataset.flash !== '1') return;
    t.dataset.flash = '0';
    t.classList.remove('opacity-0');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function () { t.classList.add('opacity-0'); }, 1800);
  });
</script>
</body>
</html>
