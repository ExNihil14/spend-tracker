<div id="settings-categories">
{% if error %}
<div class="px-5 py-2 text-sm text-rose-400 border-b border-slate-800">{{ error }}</div>
{% endif %}
<div class="table-scroll overflow-x-auto" role="region" aria-label="Категории" tabindex="0">
  <table class="w-full text-sm">
    <thead>
      <tr class="text-left text-xs uppercase tracking-wide text-slate-400 border-b border-slate-800 bg-slate-950/40">
        <th class="px-5 py-2.5 font-medium">Категория</th>
        <th class="px-5 py-2.5 font-medium text-right">Использований</th>
        <th class="px-5 py-2.5 font-medium">Цвет</th>
        <th class="px-5 py-2.5 font-medium"></th>
      </tr>
    </thead>
    <tbody>
      {% for c in categories %}
      <tr class="border-b border-slate-800/60 last:border-0 hover:bg-slate-800/30 transition-colors">
        <td class="px-5 py-3">
          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium"
                style="background:{{ c.color }};color:{{ badge_text(c.color) }}">{{ catname(c.name) }}</span>
        </td>
        <td class="px-5 py-3 text-right text-slate-400">{{ usage.get(c.name, 0) }}</td>
        <td class="px-5 py-3">
          <form hx-post="/settings/categories/color" hx-target="#settings-categories" hx-swap="outerHTML"
                class="flex items-center gap-2">
            <input type="hidden" name="file_hash" value="{{ file_hash }}">
            <input type="hidden" name="name" value="{{ c.name }}">
            <input type="color" name="color" value="{{ c.color }}" aria-label="Цвет категории {{ catname(c.name) }}"
                   class="h-8 w-10 bg-slate-800 border border-slate-700 rounded cursor-pointer">
            <button type="submit" class="text-xs text-blue-400 hover:text-blue-300 px-1">OK</button>
          </form>
        </td>
        <td class="px-5 py-3 text-right">
          <form hx-post="/settings/categories/delete" hx-target="#settings-categories" hx-swap="outerHTML">
            <input type="hidden" name="file_hash" value="{{ file_hash }}">
            <input type="hidden" name="name" value="{{ c.name }}">
            <button type="submit" {% if usage.get(c.name, 0) %}disabled title="используется — удаление запрещено"{% endif %}
                    class="text-xs rounded-lg px-3 py-1.5 transition-colors
                           {{ 'bg-slate-800 text-slate-600 cursor-not-allowed' if usage.get(c.name, 0)
                              else 'bg-rose-700/70 hover:bg-rose-600 text-white' }}">Удалить</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<form hx-post="/settings/categories" hx-target="#settings-categories" hx-swap="outerHTML"
      class="flex flex-wrap items-center gap-2 px-5 py-3 border-t border-slate-800">
  <input type="hidden" name="file_hash" value="{{ file_hash }}">
  <input name="name" placeholder="новая-категория" aria-label="Имя новой категории" required
         class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
  <input type="color" name="color" value="#9ca3af" aria-label="Цвет новой категории"
         class="h-8 w-10 bg-slate-800 border border-slate-700 rounded cursor-pointer">
  <button type="submit" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-medium rounded-lg px-3 py-1.5 transition-colors">Добавить</button>
</form>
<form hx-post="/settings/categories/rename/preview" hx-target="#rename-confirm" hx-swap="innerHTML"
      class="flex flex-wrap items-center gap-2 px-5 py-3 border-t border-slate-800">
  <input type="hidden" name="file_hash" value="{{ file_hash }}">
  <span class="text-xs uppercase tracking-wide text-slate-400">Переименовать:</span>
  <select name="name" aria-label="Категория для переименования"
          class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    {% for c in categories %}<option value="{{ c.name }}">{{ c.name }}</option>{% endfor %}
  </select>
  <input name="new_name" placeholder="новое-имя" aria-label="Новое имя категории" required
         class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
  <button type="submit" class="bg-amber-700/70 hover:bg-amber-600 text-white text-xs font-medium rounded-lg px-3 py-1.5 transition-colors">Проверить</button>
</form>
<div id="rename-confirm"></div>
</div>
