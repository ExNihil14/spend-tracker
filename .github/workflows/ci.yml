name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # O1 адъюдикации 29.09: дефолт 360 мин — зависший замер съедал бы часы молча
    steps:
      # Actions пиннуты по commit SHA (иммутабельный релиз), версия — в комментарии
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # нужны origin/<base_ref> и event.before для baseline-guard
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Pytest (unit)
        run: uv run pytest -q

      - name: Prebuilt CSS check
        run: uv run python scripts/build_css.py --check

      - name: pip-audit (dependency vulnerabilities)
        run: uv run pip-audit --skip-editable

      - name: Contract delta (public API + DB schema + routes)
        run: uv run python scripts/contract_delta.py check

      - name: Baseline guard (изменение базлайнов — только с трейлером Contract-Change)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          uv run python scripts/baseline_guard.py --base "$BASE"

      - name: Ratchet metrics (только вниз)
        run: uv run python scripts/ratchet.py check

      - name: Complexity ratchet (C901, только вниз)
        run: uv run python scripts/cc_ratchet.py check

      - name: "Ratchet baseline guard (PR: базлайн не вырос)"
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ratchet-raise')
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          uv run python scripts/ratchet.py guard --base "origin/${{ github.base_ref }}"

      - name: "Ratchet baseline guard (push: базлайн не вырос против прошлого main)"
        if: github.event_name == 'push'
        run: uv run python scripts/ratchet.py guard --base "${{ github.event.before }}"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install Playwright (chromium)
        run: uv run playwright install --with-deps chromium

      - name: Pytest (e2e, Playwright)
        run: uv run pytest -m e2e -q --tracing=retain-on-failure --output=test-results

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: e2e-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  cross-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install Playwright (firefox, webkit)
        run: uv run playwright install --with-deps firefox webkit

      - name: Cross-browser smoke (render, 320px reflow, axe)
        run: uv run pytest tests/e2e/test_crossbrowser_smoke.py -m e2e -q --browser firefox --browser webkit --tracing=retain-on-failure --output=test-results

      - name: Upload cross-browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cross-browser-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    # Тикет 03.10: смоук установки — образ собирается, сервер поднимается, doctor/paths работают внутри.
    # Локальное доказательство прогона: C:\Users\HP\AppData\Local\Temp\opencode\docker_smoke.ps1.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build image
        run: docker build -t spendtrack:ci .

      - name: Run + doctor smoke (fresh volume)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/st-data"
          docker run -d --name spendtrack-ci -p 127.0.0.1:8766:8766 \
            -v "$RUNNER_TEMP/st-data:/data" spendtrack:ci
          ok=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8766/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "health не поднялся"; docker logs spendtrack-ci; exit 1
          fi
          # wave6 №6: проверяем ДОКУМЕНТИРОВАННУЮ команду (PATH/entrypoint), а не абсолютный путь
          if ! docker exec spendtrack-ci spendtrack doctor; then
            echo "doctor упал"; docker logs spendtrack-ci; exit 1
          fi
          if ! docker exec spendtrack-ci spendtrack paths; then
            echo "paths упал"; docker logs spendtrack-ci; exit 1
          fi
          # том смонтирован и реально используется (БД/снимки легли на volume, а не в ФС контейнера)
          test -n "$(ls -A "$RUNNER_TEMP/st-data")"

      - name: Cleanup
        if: always()
        run: docker rm -f spendtrack-ci || true
