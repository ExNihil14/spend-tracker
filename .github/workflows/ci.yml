name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions пиннуты по commit SHA (иммутабельный релиз), версия — в комментарии
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # нужны origin/<base_ref> и event.before для baseline-guard
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Pytest (unit)
        run: uv run pytest -q

      - name: Prebuilt CSS check
        run: uv run python scripts/build_css.py --check

      - name: pip-audit (dependency vulnerabilities)
        run: uv run pip-audit --skip-editable

      - name: Contract delta (public API + DB schema + routes)
        run: uv run python scripts/contract_delta.py check

      - name: Baseline guard (изменение базлайнов — только с трейлером Contract-Change)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          uv run python scripts/baseline_guard.py --base "$BASE"

      - name: Ratchet metrics (только вниз)
        run: uv run python scripts/ratchet.py check

      - name: "Ratchet baseline guard (PR: базлайн не вырос)"
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ratchet-raise')
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          uv run python scripts/ratchet.py guard --base "origin/${{ github.base_ref }}"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install Playwright (chromium)
        run: uv run playwright install --with-deps chromium

      - name: Pytest (e2e, Playwright)
        run: uv run pytest -m e2e -q

  cross-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install Playwright (firefox, webkit)
        run: uv run playwright install --with-deps firefox webkit

      - name: Cross-browser smoke (render, 320px reflow, axe)
        run: uv run pytest tests/e2e/test_crossbrowser_smoke.py -m e2e -q --browser firefox --browser webkit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
