name: Supporter ($25 / 1900 ₽)
description: Отметьте интерес к разовой поддержке проекта — напишу при запуске
title: "[Supporter] Интересуюсь разовой поддержкой"
labels: ["supporter"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо! Заполнять ничего не обязательно — я вернусь в этот issue при запуске продаж.
        E-mail публиковать не нужно: ответ придёт уведомлением GitHub.
        Supporter — разовая поддержка разработки: имя в списке поддержавших (или анонимно),
        приоритет внимания к вашим issue, ранний доступ к новым сборкам (по мере появления бета-сборок).
  - type: textarea
    id: wishes
    attributes:
      label: Что для вас было бы полезно в Supporter? (необязательно)
      description: Приоритет внимания к вашим issue, ранний доступ к сборкам, что-то ещё?
    validations:
      required: false
